<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/4geeks.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SquadUp - Find Your Gaming Squad</title>
    
    <!-- Meta tags for better SEO -->
    <meta name="description" content="SquadUp - Connect with gamers, find your squad, and discover new games together. Steam integration for seamless gaming experiences." />
    <meta name="keywords" content="gaming, squad, multiplayer, steam, friends, games" />
    <meta name="author" content="API Avengers" />
    
    <!-- Open Graph meta tags for social sharing -->
    <meta property="og:title" content="SquadUp - Find Your Gaming Squad" />
    <meta property="og:description" content="Connect with gamers and find your perfect squad" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bookish-funicular-9754qgjjg9743pqr7-3000.app.github.dev" />
    
    <!-- Preconnect to external domains for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Load any external fonts if needed -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS will be injected by Vite -->
    <style>
      /* Prevent flash of unstyled content */
      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #0f172a;
        color: #e2e8f0;
      }
      
      /* Loading spinner styles */
      .loading-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #0f172a;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      
      .loading-spinner {
        width: 50px;
        height: 50px;
        border: 3px solid #1e293b;
        border-top: 3px solid #3b82f6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      .loading-text {
        margin-top: 20px;
        color: #64748b;
        font-size: 14px;
      }
      
      /* Hide loading container when React takes over */
      .app-loaded .loading-container {
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- Loading screen shown while React app loads -->
    <div class="loading-container" id="loading-screen">
      <div style="text-align: center;">
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading SquadUp...</div>
      </div>
    </div>
    
    <!-- React app will mount here -->
    <div id="root"></div>
    
    <!-- Vite will inject the main.jsx script here -->
    <script type="module" src="/src/front/main.jsx"></script>
    
    <!-- Remove loading screen once React has loaded -->
    <script>
      // Hide loading screen once the React app has mounted
      window.addEventListener('load', function() {
        setTimeout(() => {
          const loadingScreen = document.getElementById('loading-screen');
          if (loadingScreen) {
            loadingScreen.style.opacity = '0';
            loadingScreen.style.transition = 'opacity 0.3s ease';
            setTimeout(() => {
              loadingScreen.style.display = 'none';
              document.body.classList.add('app-loaded');
            }, 300);
          }
        }, 100);
      });
      
      // Also hide on DOMContentLoaded as fallback
      document.addEventListener('DOMContentLoaded', function() {
        // Give React a moment to mount
        setTimeout(() => {
          const root = document.getElementById('root');
          if (root && root.children.length > 0) {
            const loadingScreen = document.getElementById('loading-screen');
            if (loadingScreen) {
              loadingScreen.style.display = 'none';
              document.body.classList.add('app-loaded');
            }
          }
        }, 500);
      });
    </script>
  </body>
</html>
